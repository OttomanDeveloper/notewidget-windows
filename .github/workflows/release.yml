name: Release

# Tag-driven, deliberately. Nothing is published from a branch, so what is on
# the Releases page is always exactly what a tag points at.
on:
  push:
    tags:
      - 'v*'

# Only what creating a release needs. A release workflow that can write to the
# repository at large is a much better prize for a leaked token.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        # Needed for the setup.exe. The packaging script falls back to the
        # portable ZIP alone if it is missing, so this is belt and braces.
        run: choco install innosetup -y --no-progress

      - name: Check the tag matches the version in pubspec.yaml
        shell: pwsh
        run: |
          # The exe's version resource and the artifact filenames both come from
          # pubspec.yaml. Without this check a tag called v1.2.0 could publish a
          # binary that calls itself 1.1.0, and nobody would notice until a bug
          # report named the wrong version.
          #
          # Kept as flat one-liners on purpose. A parenthesised pipeline split
          # across lines after a pipe does not parse, and the first version of
          # this step failed on exactly that.
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          if ($null -eq $line) { Write-Host 'no version: line in pubspec.yaml'; exit 1 }
          $version = ($line.Line -split ':', 2)[1].Trim() -replace '\+.*$', ''
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne $tag) {
            Write-Host "pubspec.yaml says '$version' but the tag says '$tag'"
            Write-Host 'Set version: in pubspec.yaml to the tag, or tag the commit that already has it.'
            exit 1
          }
          Write-Host "tag v$tag matches pubspec.yaml ($version)"

      - name: Build the artifacts
        # Runs the tests and the analyzer, launches the staged build to prove it
        # starts, and verifies the ZIP actually contains the engine. Refuses to
        # finish on any of those.
        run: pwsh -File tool/release/package.ps1

      - name: Take the release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # GitHub's generated notes list the merged pull requests, which says
          # what changed and nothing about why. The CHANGELOG entry says why,
          # and this is the page people read before deciding whether to upgrade,
          # so it is worth one step to use it.
          #
          # Fails rather than publishing empty notes: a release whose notes are
          # missing is worse than one that took a minute longer.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $lines = Get-Content CHANGELOG.md

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($version))\s*$") {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            Write-Host "CHANGELOG.md has no '## $version' section."
            Write-Host 'Rename the Unreleased section before tagging.'
            exit 1
          }

          # The section runs until the next heading of the same level.
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') {
              $end = $i
              break
            }
          }

          $body = if ($end -gt $start + 1) { $lines[($start + 1)..($end - 1)] } else { @() }
          if ($body.Count -eq 0) {
            Write-Host "The '## $version' section of CHANGELOG.md is empty."
            exit 1
          }

          $text = ($body -join "`n").Trim()
          Set-Content -Path release-notes.md -Value $text -Encoding UTF8
          Write-Host "release-notes.md: $($body.Count) lines from '## $version'"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
          body_path: release-notes.md
          fail_on_unmatched_files: true