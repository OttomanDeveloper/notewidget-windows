name: CI

# Every push and every pull request. The point is to catch a broken build before
# it can be tagged, since the tag is what publishes to the Releases page.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: The gate
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: The gate
        # One command, the same one a person runs before pushing, so "green
        # locally" and "green here" mean the same thing. The stage order is a
        # dependency order and lives in the script, not here.
        #
        # `Icons` is skipped because it needs the built installer, and Inno Setup
        # is not installed on this runner. Its source-side checks still run in
        # `icon_guard_test`, and the release workflow builds the installer for
        # real. `Random` is skipped because it is a second pass over the same
        # tests to hunt flakes - useful before a push, noise in CI.
        shell: pwsh
        run: ./tool/verify/verify.ps1 -Skip Icons,Random