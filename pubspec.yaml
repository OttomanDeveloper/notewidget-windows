name: win_notes
description: "Desktop notes widget for Windows 11 Pro. Notes stay on screen and come back on every boot. No account, no server, no network."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
