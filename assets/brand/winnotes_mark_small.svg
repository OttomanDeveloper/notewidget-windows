<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinNotes - small-size mark (16 / 24 / 32 px only).
  Same idea as winnotes_mark.svg with every element thickened and the
  dog-ear and rotation dropped, because at 16px those are sub-pixel noise
  and the rotation makes the silhouette read as a smudge.
  Three fat marks on a card survive downscaling; six thin ones do not.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img"
     aria-label="WinNotes logo">
  <defs>
    <linearGradient id="plateS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1F1A38"/>
      <stop offset="0.55" stop-color="#332A6B"/>
      <stop offset="1"    stop-color="#4A3C93"/>
    </linearGradient>

    <radialGradient id="sheenS" cx="0.28" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#9A8CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9A8CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardS" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEBE1"/>
    </linearGradient>

    <filter id="shadowS" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26"
                    flood-color="#0B0818" flood-opacity="0.42"/>
    </filter>

    <clipPath id="plateClipS">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClipS)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#plateS)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheenS)"/>
  </g>

  <g filter="url(#shadowS)">
    <rect x="228" y="228" width="568" height="568" rx="132" fill="url(#cardS)"/>
  </g>

  <!-- Two settled lines, then the accent caret. No fold, no rotation. -->
  <rect x="352" y="404" width="324" height="86" rx="43" fill="#AFB5C8"/>
  <rect x="352" y="560" width="216" height="86" rx="43" fill="#AFB5C8"/>
  <rect x="616" y="560" width="86" height="86" rx="43" fill="#FF7A45"/>
</svg>