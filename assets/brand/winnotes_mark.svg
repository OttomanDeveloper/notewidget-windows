<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinNotes - primary mark.
  A note card mid-write: two settled lines, one live line, one caret.
  Deep indigo plate so the off-white card reads as a floating desktop surface.
  Master geometry is a 1024x1024 grid. Do not edit the rounded-plate radius
  without re-checking winnotes_mark_small.svg, which simplifies the same idea.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img"
     aria-label="WinNotes logo">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1F1A38"/>
      <stop offset="0.55" stop-color="#332A6B"/>
      <stop offset="1"    stop-color="#4A3C93"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.78">
      <stop offset="0"   stop-color="#9A8CFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#9A8CFF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#9A8CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEBE1"/>
    </linearGradient>

    <linearGradient id="foldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#D9D2C1"/>
      <stop offset="1"   stop-color="#C7BFA9"/>
    </linearGradient>

    <linearGradient id="caretFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9163"/>
      <stop offset="1" stop-color="#FF6A38"/>
    </linearGradient>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30"
                    flood-color="#0B0818" flood-opacity="0.46"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8"
                    flood-color="#0B0818" flood-opacity="0.30"/>
    </filter>

    <filter id="foldShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="-6" stdDeviation="9"
                    flood-color="#8A8170" flood-opacity="0.45"/>
    </filter>

    <clipPath id="plateClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- Plate: Windows 11 squircle-ish rounded square. -->
  <g clip-path="url(#plateClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#plate)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
  </g>

  <!--
    Card. Rotated -5deg so the mark reads as a physical object being placed
    on the desktop rather than a flat UI glyph.
  -->
  <g transform="rotate(-5 512 512)">
    <g filter="url(#cardShadow)">
      <rect x="222" y="206" width="580" height="612" rx="88" fill="url(#cardFill)"/>
    </g>

    <!-- Top edge catch-light: sells the card as a lit surface. -->
    <path d="M 310 206 L 714 206 A 88 88 0 0 1 802 294"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
          stroke-width="7" stroke-linecap="round"/>

    <!-- Dog-ear fold, bottom-right, clipped to the card's own corner radius. -->
    <g filter="url(#foldShadow)">
      <path d="M 802 730 A 88 88 0 0 1 714 818 L 802 818 Z" fill="url(#foldFill)"/>
    </g>
    <path d="M 802 730 A 88 88 0 0 1 714 818"
          fill="none" stroke="#A79E88" stroke-opacity="0.55" stroke-width="5"/>

    <!-- Settled lines. -->
    <rect x="336" y="336" width="268" height="42" rx="21" fill="#AEB4C6"/>
    <rect x="336" y="432" width="206" height="42" rx="21" fill="#AEB4C6"/>

    <!-- The live line, still being written. -->
    <rect x="336" y="528" width="318" height="44" rx="22" fill="#4B3FC0"/>

    <!-- Caret, taller than its line and in the accent so it survives 16px. -->
    <rect x="678" y="514" width="42" height="72" rx="21" fill="url(#caretFill)"/>
  </g>
</svg>