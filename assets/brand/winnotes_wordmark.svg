<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinNotes - horizontal lockup, for README banners, the installer welcome
  header and the Settings "About" row. Intended for dark backgrounds only.

  Text is left as <text> rather than outlined paths so the lockup stays
  editable. It is rasterised on Windows with Segoe UI Variable Display, which
  every supported Windows 11 build ships. If this ever needs to render
  somewhere without that font, convert the two runs to paths first.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480"
     viewBox="0 0 1600 480" role="img"
     aria-label="WinNotes">
  <defs>
    <linearGradient id="plateW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1F1A38"/>
      <stop offset="0.55" stop-color="#332A6B"/>
      <stop offset="1"    stop-color="#4A3C93"/>
    </linearGradient>
    <radialGradient id="sheenW" cx="0.28" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#9A8CFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9A8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardW" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEBE1"/>
    </linearGradient>
    <linearGradient id="foldW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D2C1"/>
      <stop offset="1" stop-color="#C7BFA9"/>
    </linearGradient>
    <linearGradient id="caretW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9163"/>
      <stop offset="1" stop-color="#FF6A38"/>
    </linearGradient>
    <filter id="cardShadowW" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26"
                    flood-color="#0B0818" flood-opacity="0.46"/>
    </filter>
    <filter id="foldShadowW" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="-5" stdDeviation="8"
                    flood-color="#8A8170" flood-opacity="0.45"/>
    </filter>
    <clipPath id="plateClipW">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- Mark, scaled from the 1024 master grid. -->
  <g transform="translate(36 60) scale(0.3515625)">
    <g clip-path="url(#plateClipW)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#plateW)"/>
      <rect x="0" y="0" width="1024" height="1024" fill="url(#sheenW)"/>
    </g>
    <g transform="rotate(-5 512 512)">
      <g filter="url(#cardShadowW)">
        <rect x="222" y="206" width="580" height="612" rx="88" fill="url(#cardW)"/>
      </g>
      <path d="M 310 206 L 714 206 A 88 88 0 0 1 802 294"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
            stroke-width="7" stroke-linecap="round"/>
      <g filter="url(#foldShadowW)">
        <path d="M 802 730 A 88 88 0 0 1 714 818 L 802 818 Z" fill="url(#foldW)"/>
      </g>
      <rect x="336" y="336" width="268" height="42" rx="21" fill="#AEB4C6"/>
      <rect x="336" y="432" width="206" height="42" rx="21" fill="#AEB4C6"/>
      <rect x="336" y="528" width="318" height="44" rx="22" fill="#4B3FC0"/>
      <rect x="678" y="514" width="42" height="72" rx="21" fill="url(#caretW)"/>
    </g>
  </g>

  <!-- Wordmark. -->
  <text x="470" y="292"
        font-family="'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif"
        font-size="188" font-weight="700" letter-spacing="-6">
    <tspan fill="#F3F1EA">Win</tspan><tspan fill="#A99CFF">Notes</tspan>
  </text>
</svg>