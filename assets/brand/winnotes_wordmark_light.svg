<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinNotes - horizontal lockup for LIGHT backgrounds.

  Identical to winnotes_wordmark.svg except that "Win" is dark ink instead of
  near-white. The transparent-background PNG of the light-on-dark lockup is
  unreadable on a white page, which is where a README is going to put it, so
  both variants ship and docs pick by surface.

  Mark geometry is unchanged from the 1024 master.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480"
     viewBox="0 0 1600 480" role="img"
     aria-label="WinNotes">
  <defs>
    <linearGradient id="plateL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#1F1A38"/>
      <stop offset="0.55" stop-color="#332A6B"/>
      <stop offset="1"    stop-color="#4A3C93"/>
    </linearGradient>
    <radialGradient id="sheenL" cx="0.28" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#9A8CFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9A8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardL" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEBE1"/>
    </linearGradient>
    <linearGradient id="foldL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D2C1"/>
      <stop offset="1" stop-color="#C7BFA9"/>
    </linearGradient>
    <linearGradient id="caretL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9163"/>
      <stop offset="1" stop-color="#FF6A38"/>
    </linearGradient>
    <filter id="cardShadowL" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26"
                    flood-color="#0B0818" flood-opacity="0.46"/>
    </filter>
    <filter id="foldShadowL" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-4" dy="-5" stdDeviation="8"
                    flood-color="#8A8170" flood-opacity="0.45"/>
    </filter>
    <clipPath id="plateClipL">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g transform="translate(36 60) scale(0.3515625)">
    <g clip-path="url(#plateClipL)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#plateL)"/>
      <rect x="0" y="0" width="1024" height="1024" fill="url(#sheenL)"/>
    </g>
    <g transform="rotate(-5 512 512)">
      <g filter="url(#cardShadowL)">
        <rect x="222" y="206" width="580" height="612" rx="88" fill="url(#cardL)"/>
      </g>
      <path d="M 310 206 L 714 206 A 88 88 0 0 1 802 294"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.85"
            stroke-width="7" stroke-linecap="round"/>
      <g filter="url(#foldShadowL)">
        <path d="M 802 730 A 88 88 0 0 1 714 818 L 802 818 Z" fill="url(#foldL)"/>
      </g>
      <rect x="336" y="336" width="268" height="42" rx="21" fill="#AEB4C6"/>
      <rect x="336" y="432" width="206" height="42" rx="21" fill="#AEB4C6"/>
      <rect x="336" y="528" width="318" height="44" rx="22" fill="#4B3FC0"/>
      <rect x="678" y="514" width="42" height="72" rx="21" fill="url(#caretL)"/>
    </g>
  </g>

  <text x="470" y="292"
        font-family="'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif"
        font-size="188" font-weight="700" letter-spacing="-6">
    <tspan fill="#2B2450">Win</tspan><tspan fill="#6A5BD0">Notes</tspan>
  </text>
</svg>