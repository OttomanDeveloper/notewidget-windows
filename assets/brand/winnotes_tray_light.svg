<?xml version="1.0" encoding="UTF-8"?>
<!--
  WinNotes - tray mark, light taskbar (Windows is using a dark theme).
  Tray icons must be legible at 16/20/24px on a dark taskbar, so the full
  colour mark is dropped: the card becomes a solid white silhouette and the
  caret stays coral, because the caret is the only thing that carries the
  "live note" idea at that size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img"
     aria-label="WinNotes tray icon">
  <defs>
    <clipPath id="trayClipLight">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#trayClipLight)">
    <rect x="0" y="0" width="1024" height="1024" fill="#1F1A38"/>
    <rect x="228" y="228" width="568" height="568" rx="132" fill="#FFFFFF"/>
    <rect x="352" y="404" width="324" height="86" rx="43" fill="#5A5F73"/>
    <rect x="352" y="560" width="216" height="86" rx="43" fill="#5A5F73"/>
    <rect x="616" y="560" width="86" height="86" rx="43" fill="#FF7A45"/>
  </g>
</svg>